
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Manav Sharma through the accessible contact form.">
    <meta name="author" content="Manav Sharma">
    <title>Contact Me | Manav Sharma</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <nav aria-label="Main navigation">
        <a href="index.html" class="logo">MyPortfolio</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
        <button id="theme-toggle" class="theme-toggle" type="button">
    ☀️ Light Mode
</button>
    </nav>
</header>

<main class="page-content">
    <section aria-labelledby="contact-title">
        <h1 id="contact-title">Contact Me</h1>
        <p class="intro">LET'S CONNECT</p>

        <form id="contact-form" class="content-card">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name"
                       autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message"
                          rows="5" required></textarea>
            </div>

            <button type="submit" class="btn">Send Message</button>

            <p id="form-status" role="status" aria-live="polite"></p>

        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Manav Sharma. All rights reserved.</p>
</footer>

</body>
</html>
